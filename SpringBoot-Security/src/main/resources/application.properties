spring.application.name=SpringBoot-Security

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/springBootLearn
spring.datasource.username=root
spring.datasource.password=Akhil@04

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080


# ===============================
# JWT
# ===============================

# Access Token = 15 minutes
app.jwt.secret=MySuperSecureJwtSecretKeyForSpringBoot2026!
app.jwt.expiration=900000

# Refresh Token = 7 days
app.jwt.refresh-expiration=604800000


# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO


# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ===============================
# REFRESH TOKEN CLEANUP
# ===============================

security.refresh-token.cleanup-rate=3600000
security.refresh-token.cleanup-initial-delay=60000